[package]
name = "campus-hub"
version = "0.1.0"
description = "锡院助手"
edition = "2021"

[lib]
name = "campus_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"
base64 = "0.22"
dirs = "6"
campus-auth = { path = "../../crates/campus-auth" }
