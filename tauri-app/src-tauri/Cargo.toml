[package]
name = "campus-hub"
version = "0.1.0"
description = "锡院助手"
edition = "2021"

[lib]
name = "campus_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘常驻（M5 批 4）；image-ico/image-png：运行时解码 include_bytes! 嵌入的
# icons/icon.ico / default_window_icon 回落链（Wxxy-CampusLogin 同款 feature 组合）
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
log = "0.4"
base64 = "0.22"
dirs = "6"
# updated_at 时间戳与 ICS 周次→日期展开（campus-schedule/portal 已依赖 chrono，无新增传递依赖）
chrono = "0.4"
campus-auth = { path = "../../crates/campus-auth" }
campus-portal = { path = "../../crates/campus-portal" }
# 课表领域模型（Timetable/Course 等，get_timetable IPC 透出；解析仍在 campus-schedule）
campus-schedule = { path = "../../crates/campus-schedule" }
# 慧新E校（一卡通）协议核心：钱包页与首页钱包卡取数（M3 批 2）
campus-synjones = { path = "../../crates/campus-synjones" }
tauri-plugin-opener = "2"
# 系统通知（M5 通知中心）：只在 Rust 侧经 NotificationExt 调用（poll_tick），
# 不开放前端直接 invoke 插件命令，故无需额外 capability（与 opener 同款）。
tauri-plugin-notification = "2"
# 日志：log::warn/error 的输出端（此前无 logger，后台轮询的失败 warn 全部静默丢弃，
# 排障盲区——M2 [meeting-diag] 教训重演）。dev 下进 stderr，tauri dev 终端可见。
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }

[dev-dependencies]
# 校外（OffCampus）全链路 live 探针（tests/webvpn_offcampus_live.rs）：WebVPN 会话直用；
# tokio macros/rt 供 #[tokio::test]（主依赖只开 sync/time，保持产品构建最小化）。
campus-webvpn = { path = "../../crates/campus-webvpn" }
tokio = { version = "1", features = ["macros", "rt"] }
