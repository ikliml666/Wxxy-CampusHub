[package]
name = "campus-synjones"
version = "0.1.0"
edition = "2021"
description = "锡院助手慧新E校（新中中/synjones）协议核心：CAS→lyCas SSO 桥换 token / 统一头组注入 / 三套响应信封解析（无 Tauri 依赖）"
license = "Apache-2.0"

[dependencies]
# 复用 CAS 会话：CasClient::sso_ticket 换票 + sso_follow 手动跟随 302 链（共用同一 Cookie jar）
campus-auth = { path = "../campus-auth" }
# 版本与 features 照抄 campus-auth/campus-portal（内网明文 IP 也需 rustls-tls 的 client 构建能力）
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "cookies",
    "charset",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 人脸采集（fapi）：JSEncrypt 等价（PKCS#1 v1.5 公钥加密）、sign 头 md5、multipart 上传
rsa = "0.9"
base64 = "0.22"
md-5 = "0.10"

[dev-dependencies]
# live 探针（tests/synjones_live.rs）与桩服务单测的 #[tokio::test] 运行时
tokio = { version = "1", features = ["rt", "macros"] }
# 探针解码 CAS 验证码 PNG（campus_auth::captcha::solve 入参为字节）
base64 = "0.22"
